<section class="task-stats">
  <article class="stat-card stat-total">
    <span class="stat-label">Total</span>
    <strong class="stat-value">{{ totalTasks }}</strong>
  </article>

  <article class="stat-card stat-pending">
    <span class="stat-label">Pendientes</span>
    <strong class="stat-value">{{ pendingTasks }}</strong>
  </article>

  <article class="stat-card stat-progress">
    <span class="stat-label">En proceso</span>
    <strong class="stat-value">{{ inProcessTasks }}</strong>
  </article>

  <article class="stat-card stat-completed">
    <span class="stat-label">Completadas</span>
    <strong class="stat-value">{{ completedTasks }}</strong>
  </article>
</section>
