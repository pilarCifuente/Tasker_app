@if (isVisible) {
    <div class="modal-backdrop" (click)="onBackdropClick($event)">
      <div class="modal-card">
  
        <header class="modal-header">
          <div class="modal-title-group">
            <div class="modal-badge">
              <span></span>
              {{ isEditMode ? 'Editar tarea' : 'Nueva tarea' }}
            </div>
            <h2>{{ isEditMode ? 'Editar tarea' : 'Crear tarea' }}</h2>
          </div>
          <button class="modal-close" type="button" (click)="close()" aria-label="Cerrar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </header>
  
        <div class="modal-body">
  
          <!-- Título -->
          <div class="form-group">
            <label for="task-title">Título <span class="required">*</span></label>
            <input
              id="task-title"
              type="text"
              placeholder="Ej: Revisar pull requests"
              [(ngModel)]="task.title"
              (input)="error = ''"
            />
          </div>
  
          <!-- Descripción -->
          <div class="form-group">
            <label for="task-desc">Descripción</label>
            <textarea
              id="task-desc"
              placeholder="Detallá en qué consiste la tarea..."
              [(ngModel)]="task.description"
              rows="3"
            ></textarea>
          </div>
  
          <!-- Prioridad + Estado -->
          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Prioridad</label>
              <select id="task-priority" [(ngModel)]="task.priority">
                @for (p of priorities; track p.value) {
                  <option [value]="p.value">{{ p.label }}</option>
                }
              </select>
            </div>
  
            <div class="form-group">
              <label for="task-status">Estado</label>
              <select id="task-status" [(ngModel)]="task.status">
                @for (s of statuses; track s.value) {
                  <option [value]="s.value">{{ s.label }}</option>
                }
              </select>
            </div>
          </div>
  
          <!-- Fecha -->
          <div class="form-group">
            <label for="task-due">Fecha de vencimiento</label>
            <input
              id="task-due"
              type="date"
              [(ngModel)]="task.dueDate"
            />
          </div>
  
          <!-- Error -->
          @if (error) {
            <p class="form-error">{{ error }}</p>
          }
  
        </div>
  
        <footer class="modal-footer">
          <button class="btn-secondary" type="button" (click)="close()">
            Cancelar
          </button>
          <button class="btn-primary" type="button" (click)="submit()" [disabled]="loading">
            @if (loading) {
              <span class="btn-spinner"></span>
              {{ isEditMode ? 'Guardando...' : 'Creando...' }}
            } @else {
              <span>{{ isEditMode ? '✓' : '+' }}</span>
              {{ isEditMode ? 'Guardar cambios' : 'Crear tarea' }}
            }
          </button>
        </footer>
  
      </div>
    </div>
  }
